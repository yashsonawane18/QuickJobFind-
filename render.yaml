services:
  # QuickJob API Backend Service (FastAPI)
  - type: web
    name: quickjob-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd job_engine && uvicorn api_server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_RETENTION_DAYS
        value: "15"
      - key: ADMIN_EMAIL
        value: "admin@quickjob.io"
      - key: ADMIN_PASSWORD
        value: "QuickJobAdmin2025!"
      - key: JWT_SECRET
        generateValue: true

  # QuickJob Frontend Static Web App (Vite React)
  - type: web
    name: quickjob-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: quickjob-backend
          property: host
      - key: VITE_FEATURE_JOB_DISCOVERY
        value: "true"
